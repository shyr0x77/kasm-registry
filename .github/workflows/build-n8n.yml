name: Build Kasm n8n

on:
  workflow_dispatch:
  push:
    branches:
      - "1.1"
    paths:
      - "docker/n8n/**"
      - ".github/workflows/build-n8n.yml"
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kasm-n8n
          tags: |
            type=raw,value=1.19.0
            type=sha,prefix=1.19.0-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: docker/n8n
          file: docker/n8n/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KASM_TAG=1.19.0-rolling-weekly
            NODE_TAG=24-bookworm-slim
            N8N_VERSION=2.42.6
          cache-from: type=gha
          cache-to: type=gha,mode=max
