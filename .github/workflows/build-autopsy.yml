name: Build Kasm Autopsy

on:
  workflow_dispatch:
  push:
    branches:
      - "1.1"
    paths:
      - "docker/autopsy/**"
      - ".github/workflows/build-autopsy.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kasm-autopsy
          tags: |
            type=raw,value=1.19.0
            type=sha,prefix=1.19.0-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: docker/autopsy
          file: docker/autopsy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

